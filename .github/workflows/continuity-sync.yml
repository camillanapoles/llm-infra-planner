name: Continuity sync

# ─────────────────────────────────────────────────────────────────────────────
# STATE CONSOLIDATION — measures the project's objective invariants (wasm
# artifacts, tests, build, lint, docker config) and commits the derived state to
# `main`: .kiro/state/project-state.json, STATE.md, RESUME.md and public/state.json.
#
# This is what makes "continue from where we stopped" true after a merge: the
# state file records the verified commit, the current phase and the next tasks,
# and the next branch is expected to start from it (the gate enforces that a
# kernel change is re-verified after the last sync).
#
# Spec: .kiro/specs/17-continuity-gate.md

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'      # Mondays 06:17 UTC — keeps the state fresh even on quiet weeks
  workflow_dispatch:
    inputs:
      fast:
        description: 'Skip tests/build/lint (only wasm + docker static checks)'
        type: boolean
        default: false
      pages:
        description: 'Also build the 3-environment Pages artifact'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: continuity-sync
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  sync:
    name: Measure & consolidate state
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Sync project state
        env:
          FAST: ${{ inputs.fast }}
          PAGES: ${{ inputs.pages }}
        run: |
          set -uo pipefail
          FLAGS=""
          [ "$FAST" = "true" ] && FLAGS="$FLAGS --fast"
          [ "$PAGES" = "true" ] && FLAGS="$FLAGS --pages"
          npx tsx scripts/continuity.ts sync $FLAGS || echo "::warning::um dos gates falhou — o estado registra o resultado real"
          echo "── diff ──"
          git status --short

      - name: Commit state to main
        id: commit
        run: |
          set -euo pipefail
          git config user.name  "continuity-sync[bot]"
          git config user.email "continuity-sync@users.noreply.github.com"
          git add .kiro/state public/state.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "estado já estava atualizado"
          else
            git commit -m "chore(continuity): sync project state [skip ci]"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish state — direct push, else PR, else run artifact
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED: ${{ steps.commit.outputs.changed }}
        run: |
          set -uo pipefail
          if [ "$CHANGED" != "true" ]; then exit 0; fi

          # 1) Direct push — the default path, and the only one with no owner
          #    setting in the way. Works whenever `main` is not protected.
          if git push origin HEAD:main > /tmp/direct.log 2>&1; then
            echo "✓ estado publicado direto na main"
            echo "published=direct" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "── push direto para a main recusado ──"; sed 's/^/  /' /tmp/direct.log

          # 2) Protected main → branch + PR. Errors are surfaced on purpose:
          #    hiding them (as this step used to) left orphan branches behind
          #    while the log claimed the state was safe in the run artifact.
          BRANCH="chore/continuity-state-$(date +%Y%m%d-%H%M)"
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"

          if gh pr create --base main --head "$BRANCH" \
               --title "chore(continuity): sync project state" \
               --body "Atualização automática do estado do projeto (.kiro/state + public/state.json).

          Gerado por \`continuity-sync\`. Veja \`.kiro/state/RESUME.md\` para o ponto de retomada." \
               > /tmp/pr.log 2>&1; then
            PR=$(gh pr view "$BRANCH" --json number --jq .number)
            echo "pr=$PR" >> "$GITHUB_OUTPUT"
            echo "published=pr" >> "$GITHUB_OUTPUT"
            # `--auto` needs "Allow auto-merge" enabled on the repository, so try
            # a plain merge first and fall back to auto-merge.
            if gh pr merge "$PR" --squash --delete-branch > /tmp/merge.log 2>&1; then
              echo "✓ PR #$PR mergeado (squash)"
            elif gh pr merge "$PR" --squash --auto --delete-branch > /tmp/merge2.log 2>&1; then
              echo "✓ PR #$PR criado com auto-merge"
            else
              echo "::notice::PR #$PR aberto — a main exige revisão para mergear; estado no branch $BRANCH"
            fi
          else
            echo "published=branch" >> "$GITHUB_OUTPUT"
            echo "::warning::gh pr create falhou — estado publicado no branch $BRANCH e no artefato desta run"
            sed 's/^/  /' /tmp/pr.log
          fi

      # The state is never only in the job summary: whichever path above ran, the
      # snapshot is downloadable from the run.
      - name: Upload state artifact
        if: always() && steps.commit.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: continuity-state-${{ github.sha }}
          path: |
            .kiro/state
            public/state.json
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "### Continuity sync"
            echo ""
            cat .kiro/state/STATE.md
            echo ""
            if [ -n "${{ steps.publish.outputs.pr }}" ]; then
              echo "Estado publicado via PR #${{ steps.publish.outputs.pr }}."
            fi
            case "${{ steps.publish.outputs.published }}" in
              direct) echo "Estado publicado com push direto na main." ;;
              branch) echo "Estado publicado no branch e no artefato desta run (a main recusou o push direto e o PR não pôde ser aberto)." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
